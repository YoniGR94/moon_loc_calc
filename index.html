    <style>
        :root {
            --royal-blue: #0A1B3F;
            --banana-yellow: #FFE135;
            --banana-light: #FFF099;
            --white: #FFFFFF;
            --grey-light: #A0ABC0;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; padding: 0; }

        body {
            background-color: var(--royal-blue);
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 460px;
            transition: max-width 0.3s ease;
        }

        /* מצב מפה - פריסה רחבה */
        .app-container.map-mode {
            max-width: 1500px;
            flex-direction: row;
            height: calc(100vh - 30px);
        }

        .panel {
            flex: 0 0 auto;
            width: 100%;
            max-width: 460px;
            background-color: rgba(255, 255, 255, 0.05);
            padding: 20px 25px; 
            border-radius: 16px;
            border: 1px solid rgba(255, 225, 53, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            overflow-y: auto;
        }

        .app-container.map-mode .panel {
            width: 460px; 
            height: 100%;
        }

        .map-wrap {
            display: none;
            flex: 1;
            min-width: 0;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 225, 53, 0.2);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .app-container.map-mode .map-wrap {
            display: block;
        }

        #map {
            width: 100%;
            height: 100%;
            background: var(--royal-blue);
            cursor: crosshair;
        }

        #map.dark-tiles .leaflet-tile-pane {
            filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.7);
        }

        .moon-pin {
            width: 22px; height: 22px; border-radius: 50%;
            background: var(--banana-yellow); border: 3px solid var(--royal-blue);
            box-shadow: 0 0 0 2px var(--banana-yellow), 0 0 14px 4px rgba(255, 225, 53, 0.6);
        }

        .header { text-align: center; margin-bottom: 15px; } 
        .header svg { width: 50px; height: 50px; fill: var(--banana-yellow); margin-bottom: 0px; }
        h1 { color: var(--banana-yellow); font-size: 22px; margin: 0; }
        
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 10px; }
        
        .lang-select { background-color: rgba(255, 255, 255, 0.1); color: var(--banana-light); border: 1px solid var(--banana-yellow); padding: 5px; border-radius: 5px; cursor: pointer; }
        .lang-select option { background-color: var(--white); color: var(--royal-blue); }

        .form-group { margin-bottom: 15px; } 
        .time-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: flex-end; }
        .time-row .form-group { margin-bottom: 0; }
        
        label { display: block; margin-bottom: 4px; color: var(--banana-light); font-size: 14px; }
        input[type="date"], input[type="time"], input[type="number"], select.main-select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--banana-yellow);
            background-color: rgba(10, 27, 63, 0.8); color: var(--white); font-size: 16px; box-sizing: border-box; color-scheme: dark;
        }

        optgroup { background-color: #0A1B3F; color: var(--banana-yellow); font-weight: bold; }
        option { color: var(--white); }

        .timezone-info { font-size: 13px; color: var(--grey-light); margin-top: 4px; text-align: left; direction: ltr; }
        
        .switch-mode-link {
            display: inline-block; margin-top: 8px; color: var(--banana-yellow); font-size: 14px; text-decoration: underline; cursor: pointer;
        }

        button.submit-btn { width: 100%; background-color: var(--banana-yellow); color: var(--royal-blue); border: none; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        .btn-now { background-color: rgba(255, 255, 255, 0.1); color: var(--banana-yellow); border: 1px solid var(--banana-yellow); padding: 10px 15px; font-size: 14px; border-radius: 8px; cursor: pointer; }
        
        #result { margin-top: 20px; display: none; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .horizon-status { text-align: center; font-size: 20px; font-weight: bold; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px; }
        .status-up { color: var(--banana-yellow); } .status-down { color: var(--grey-light); }

        .big-results-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; margin-bottom: 15px; }
        .result-box { background-color: rgba(255, 255, 255, 0.03); border-radius: 12px; padding: 10px 5px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .result-box .main-val { font-size: 18px; font-weight: bold; color: var(--white); margin-top: 5px; }
        .result-box .sub-val { font-size: 12px; color: var(--banana-light); margin-top: 4px; min-height: 18px; }

        .moon-visual { margin: 6px 0; display: flex; justify-content: center; }
        #moon-svg { filter: drop-shadow(0 0 6px rgba(255, 225, 53, 0.3)); transition: transform 0.3s; }

        .rise-set-row { display: flex; justify-content: space-around; background-color: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 10px; font-size: 14px; }
        .rise-set-row span { color: var(--banana-yellow); font-weight: bold; }

        .credit-footer { margin-top: 15px; text-align: center; font-size: 13px; opacity: 0.7; color: var(--white); }
        .credit-footer a { color: var(--banana-light); text-decoration: none; }
        .credit-footer a:hover { text-decoration: underline; opacity: 1; }

        #elevation-group { display: none; }
        .app-container.map-mode #elevation-group { display: block; }
        .app-container.map-mode #btn-open-map { display: none; }
        #btn-close-map { display: none; }
        .app-container.map-mode #btn-close-map { display: inline-block; }

        }
        @media (max-width: 380px) {
            .big-results-grid { grid-template-columns: 1fr 1fr; }
            .phase-box { grid-column: span 2; }
        }
    </style>
</head>

<div class="app-container" id="app-container">

            </svg>
            <h1 id="lbl-title">מיקום הירח</h1>
        </div>

        <form id="moonForm" onsubmit="calculateMoon(event)">
            <div class="form-group">
                <label id="lbl-date" for="date">תאריך:</label>
                <input type="date" id="date" required>
            </div>

            <div class="time-row form-group">
                <div class="form-group">
                    <label id="lbl-time" for="time">שעה:</label>
                    <input type="time" id="time" required>
                </div>
                <button type="button" class="btn-now" id="btn-now" onclick="setNow()">כעת</button>
            </div>

            <div class="form-group">
                <label id="lbl-location" for="location">מיקום:</label>
                <select id="location" class="main-select" onchange="handleListSelection()">
                    <!-- רשימת הערים תאוכלס דינמית על ידי ה-JS -->
                </select>
                <div id="tz-info" class="timezone-info"></div>
                <a id="btn-open-map" class="switch-mode-link" onclick="toggleMapMode(true)">בחר עיר אחרת (מפה)</a>
                <a id="btn-close-map" class="switch-mode-link" onclick="toggleMapMode(false)">חזרה לרשימה</a>
            </div>

            <div class="form-group" id="elevation-group">
                <label id="lbl-elevation" for="elevation">גובה מעל פני הים (מטרים):</label>
                <input type="number" id="elevation" value="0" min="0" step="1">
            </div>

            <button type="submit" class="submit-btn" id="btn-calc">חשב מיקום</button>
        </form>

        <div id="result">
            <div id="res-status" class="horizon-status"></div>
            
            <div class="big-results-grid">
                <div class="result-box">
                    <label id="lbl-alt">גובה</label>
                    <div class="main-val" id="res-altitude"></div>
                </div>
                <div class="result-box">
                    <label id="lbl-az">אזימוט</label>
                    <div class="main-val" id="res-azimuth"></div>
                    <div class="sub-val" id="res-direction"></div>
                </div>
                <div class="result-box phase-box">
                    <label id="lbl-phase">מצב הירח</label>
                    <div class="moon-visual">
                        <svg id="moon-svg" viewBox="0 0 100 100" width="40" height="40">
                            <circle cx="50" cy="50" r="50" fill="#A0ABC0" /> 
                            <path id="moon-lit-path" fill="#FFE135" d="" />
                        </svg>
                    </div>
                    <div class="sub-val" id="res-phase-text"></div>
                </div>
            </div>

            <div class="rise-set-row">
                <div id="box-rise"><span id="lbl-rise">זריחה</span> <span id="res-rise"></span></div>
                <div id="box-set"><span id="lbl-set">שקיעה</span> <span id="res-set"></span></div>
            </div>
        </div>

        <div class="credit-footer">
            © יוני גטהון ·

            <a href="https://github.com/YoniGR94/moon_loc_calc" target="_blank">GitHub</a>
        </div>
    </div>

    <div class="map-wrap">
        <div id="map" role="application" aria-label="World map"></div>
    </div>
</div>

            calc: "Calculate", alt: "Altitude", az: "Azimuth", rise: "Rise", set: "Set", noneToday: "None today",
            moonUp: "Moon is above horizon", moonDown: "Moon is below horizon", dirRtl: "ltr", phaseLbl: "Moon Phase",
            openMap: "Choose another city (Map)", closeMap: "Back to list", elevation: "Elevation above sea level (m):", custom: "Custom location (Map)",
            compass: ["N", "NE", "E", "SE", "S", "SW", "W", "NW"],
            phases: { new: "New Moon", waxCres: "Waxing Crescent", firstQuar: "First Quarter", waxGib: "Waxing Gibbous", full: "Full Moon", wanGib: "Waning Gibbous", lastQuar: "Last Quarter", wanCres: "Waning Crescent" }
        },
        ar: {
            title: "موقع القمر", date: "التاريخ:", time: "الوقت:", now: "الآن", location: "الموقع:",
            calc: "احسب الموقع", alt: "الارتفاع", az: "السمت", rise: "شروق", set: "غروب", noneToday: "لا يوجد اليوم",
            moonUp: "القمر فوق الأفق", moonDown: "القمر تحت الأفق", dirRtl: "rtl", phaseLbl: "طور القمر",
            openMap: "اختر مدينة أخرى (خريطة)", closeMap: "العودة للقائمة", elevation: "الارتفاع عن مستوى سطح البحر (م):", custom: "موقع مخصص (خريطة)",
            compass: ["شمال", "شمال شرقي", "شرق", "جنوب شرقي", "جنوب", "جنوب غربي", "غرب", "شمال غربي"],
            phases: { new: "محاق", waxCres: "هلال متزايد", firstQuar: "تربيع أول", waxGib: "أحدب متزايد", full: "بدر", wanGib: "أحدب متناقص", lastQuar: "تربيع أخير", wanCres: "هلال متناقص" }
        }
    };

    function changeLanguage() {
        currentLang = document.getElementById('lang-selector').value;
        const dict = i18n[currentLang];
        
        document.getElementById('panel').dir = dict.dirRtl;
        document.getElementById('html-root').lang = currentLang;
        
        document.getElementById('lbl-title').innerText = dict.title;
        document.getElementById('page-title').innerText = dict.title;
        document.getElementById('lbl-date').innerText = dict.date;
        document.getElementById('lbl-time').innerText = dict.time;
        document.getElementById('btn-now').innerText = dict.now;
        document.getElementById('lbl-location').innerText = dict.location;
        document.getElementById('btn-calc').innerText = dict.calc;
        document.getElementById('lbl-alt').innerText = dict.alt;
        document.getElementById('lbl-az').innerText = dict.az;
        document.getElementById('lbl-rise').innerText = dict.rise;
        document.getElementById('lbl-set').innerText = dict.set;
        document.getElementById('lbl-phase').innerText = dict.phaseLbl;
        document.getElementById('btn-open-map').innerText = dict.openMap;
        document.getElementById('btn-close-map').innerText = dict.closeMap;
        document.getElementById('lbl-elevation').innerText = dict.elevation;
        
        // יצירה דינמית של רשימת הערים ומיון
        const sel = document.getElementById('location');
        const currentVal = sel.value || 'telaviv';
        sel.innerHTML = '';
        
        const grouped = {};
        for (const [key, data] of Object.entries(citiesData)) {
            const cCode = data.country;
            if (!grouped[cCode]) grouped[cCode] = [];
            grouped[cCode].push({ key: key, name: data.names[currentLang] });
        }
        
        // מיון מדינות A-Z
        const sortedCountries = Object.keys(grouped).sort((a, b) => {
            return countriesData[a][currentLang].localeCompare(countriesData[b][currentLang], currentLang);
        });
        
        for (const cCode of sortedCountries) {
            const optGroup = document.createElement('optgroup');
            optGroup.label = countriesData[cCode][currentLang];
            
            // מיון ערים בתוך המדינה A-Z
            grouped[cCode].sort((a, b) => a.name.localeCompare(b.name, currentLang));
            
            for (const city of grouped[cCode]) {
                const opt = document.createElement('option');
                opt.value = city.key;
                opt.innerText = city.name;
                optGroup.appendChild(opt);
            }
            sel.appendChild(optGroup);
        }

        const customOpt = document.createElement('option');
        customOpt.value = 'custom';
        customOpt.id = 'loc-custom';
        customOpt.innerText = dict.custom;
        const appContainer = document.getElementById('app-container');
        customOpt.style.display = (appContainer && appContainer.classList.contains('map-mode')) ? 'block' : 'none';
        sel.appendChild(customOpt);

        if (citiesData[currentVal] || currentVal === 'custom') {
            sel.value = currentVal;
        } else {
            sel.value = 'telaviv';
        }

        if (document.getElementById('result').style.display === 'block') document.getElementById('btn-calc').click();
    }

    function updateTzInfo() {
        const offsetMs = getTimeZoneOffsetMs(Date.now(), currentLoc.timeZone);
        const offsetHours = offsetMs / 3600000;
        const sign = offsetHours >= 0 ? '+' : '';
        document.getElementById('tz-info').innerText = `${currentLoc.timeZone} · UTC${sign}${offsetHours}`;
    }

    function handleListSelection() {
        const val = document.getElementById('location').value;
        if (val === 'custom') {
            currentLoc = { ...locations.custom };
        } else {
            currentLoc = { ...citiesData[val] };
            locations.custom = { ...citiesData[val] };
        }
        updateTzInfo();
        if(mapInstance && marker) {
            marker.setLatLng([currentLoc.lat, currentLoc.lng]);
            mapInstance.setView([currentLoc.lat, currentLoc.lng]);
        }
    }

    function toggleMapMode(showMap) {
        const container = document.getElementById('app-container');
        const customOpt = document.getElementById('loc-custom');
        const sel = document.getElementById('location');
        
        if (showMap) {
            container.classList.add('map-mode');
            if (customOpt) customOpt.style.display = 'block';
            sel.value = 'custom';
            if (!mapLoaded) loadMapScripts();
            else setTimeout(() => mapInstance.invalidateSize(), 100);
        } else {
            container.classList.remove('map-mode');
            if (sel.value !== 'custom') {
                if (customOpt) customOpt.style.display = 'none';
            }
        }
    }

    function loadMapScripts() {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        document.head.appendChild(link);

        const script1 = document.createElement('script');
        script1.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
        
        const script2 = document.createElement('script');
        script2.src = 'https://cdn.jsdelivr.net/npm/tz-lookup@6.1.25/tz.js';

        let loaded = 0;
        const onScriptLoad = () => {
            loaded++;
            if (loaded === 2) {
                mapLoaded = true;
                initMap();
            }
        };

        script1.onload = onScriptLoad;
        script2.onload = onScriptLoad;
        document.body.appendChild(script1);
        document.body.appendChild(script2);
    }

    function initMap() {
        mapInstance = L.map('map', { worldCopyJump: true }).setView([currentLoc.lat, currentLoc.lng], 3);
        const esriBase = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
        L.tileLayer(esriBase + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(mapInstance);
        L.tileLayer(esriBase + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(mapInstance);
        
        marker = L.marker([currentLoc.lat, currentLoc.lng], {
            draggable: true,
            icon: L.divIcon({ className: '', html: '<div class="moon-pin"></div>', iconSize: [22, 22], iconAnchor: [11, 11] })
        }).addTo(mapInstance);

        mapInstance.on('click', (ev) => pickLocation(ev.latlng));
        marker.on('dragend', () => pickLocation(marker.getLatLng()));
    }

    function resolveTimeZone(lat, lng) {
        let tz = null;
        try { if (typeof tzlookup === 'function') tz = tzlookup(lat, lng); } catch (e) {}
        if (tz) {
            try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); return tz; } catch (e) {}
        }
        const h = Math.max(-12, Math.min(12, Math.round(lng / 15)));
        return h === 0 ? 'Etc/GMT' : 'Etc/GMT' + (h > 0 ? '-' : '+') + Math.abs(h);
    }

    function pickLocation(latlng) {
        marker.setLatLng(latlng);
        const w = latlng.wrap();
        const lat = Math.max(-90, Math.min(90, w.lat));
        
        currentLoc = { lat, lng: w.lng, timeZone: resolveTimeZone(lat, w.lng) };
        locations.custom = { ...currentLoc }; 
        document.getElementById('location').value = 'custom';
        
        updateTzInfo();
        document.getElementById('tz-info').innerText += ` | ${lat.toFixed(3)}°, ${w.lng.toFixed(3)}°`;
        if (document.getElementById('result').style.display === 'block') document.getElementById('btn-calc').click();
    }

    // --- Astronomical Algorithms ---
    const PI = Math.PI, rad = PI / 180, deg = 180 / PI, e = rad * 23.4397;
    function toDays(d) { return d / 86400000 - 10957.5; }
    function rightAscension(l, b) { return Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l)); }
    function declination(l, b) { return Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l)); }
    function azimuthCoord(H, phi, dec) { return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)); }
    function altitudeCoord(H, phi, dec) { return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)); }
    function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }
    function getSunLongitude(d) {
        const Ls = rad * (280.460 + 0.9856474 * d), Ms = rad * (356.047 + 0.9856002585 * d);
        return Ls + rad * (1.915 * Math.sin(Ms) + 0.020 * Math.sin(2 * Ms));
    }
    function moonCoords(d) {
        const L = rad * (218.316 + 13.176396 * d), M = rad * (134.963 + 13.064993 * d), F = rad * (93.272 + 13.229350 * d);
        const Ls = rad * (280.460 + 0.9856474 * d), Ms = rad * (356.047 + 0.9856002585 * d), D = L - Ls;
        const l = L + rad * (6.289 * Math.sin(M) + 1.274 * Math.sin(2 * D - M) + 0.658 * Math.sin(2 * D) + 0.186 * Math.sin(Ms));
        const b = rad * 5.128 * Math.sin(F), dt = 385001 - 20905 * Math.cos(M); 
        return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt, lng: l };
    }
    function getMoonPosition(dateValue, lat, lng) {
        const lw = rad * -lng, phi = rad * lat, d = toDays(dateValue), c = moonCoords(d), H = siderealTime(d, lw) - c.ra;
        let h = altitudeCoord(H, phi, c.dec);
        h = h - Math.asin(6371.0 / c.dist * Math.cos(h));
        let hDeg = h * deg;
        if (hDeg > -5) hDeg += 1.02 / Math.tan(rad * (hDeg + 10.3 / (hDeg + 5.11))) / 60;
        let az = azimuthCoord(H, phi, c.dec) + PI;
        return { azimuth: (az * deg) % 360, altitude: hDeg };
    }
    function getMoonRiseSet(utcStartMs, utcEndMs, lat, lng, elevation) {
        let rises = [], sets = [];
        const h0 = -0.25 - 0.0293 * Math.sqrt(elevation || 0); 
        let prevAlt = getMoonPosition(utcStartMs, lat, lng).altitude;
        for (let t = utcStartMs + 2 * 60000; t <= utcEndMs; t += 2 * 60000) {
            const alt = getMoonPosition(t, lat, lng).altitude;
            if (prevAlt < h0 && alt >= h0) rises.push(t);
            if (prevAlt >= h0 && alt < h0) sets.push(t);
            prevAlt = alt;
        }
        return { rises, sets };
    }
    function getMoonPhase(utcMs) {
        const d = toDays(utcMs), phase = ((moonCoords(d).lng - getSunLongitude(d)) / (2 * Math.PI)) % 1;
        return phase < 0 ? phase + 1 : phase;
    }
    function drawMoonPhaseVisual(phase, lat) {
        const pDict = i18n[currentLang].phases;
        let text = phase < 0.03 || phase > 0.97 ? pDict.new : phase < 0.22 ? pDict.waxCres : phase < 0.28 ? pDict.firstQuar : phase < 0.47 ? pDict.waxGib : phase < 0.53 ? pDict.full : phase < 0.72 ? pDict.wanGib : phase < 0.78 ? pDict.lastQuar : pDict.wanCres;
        document.getElementById('res-phase-text').innerText = text;
        const svg = document.getElementById('moon-svg'), path = document.getElementById('moon-lit-path');
        svg.style.transform = lat < 0 ? 'scaleX(-1)' : 'scaleX(1)';
        const sweep = phase <= 0.5 ? (phase <= 0.25 ? 0 : 1) : (phase - 0.5 <= 0.25 ? 1 : 0);
        const rx = Math.abs(50 - ((phase <= 0.5 ? phase : phase - 0.5) * 200));
        path.setAttribute('d', phase <= 0.5 ? `M 50 0 A 50 50 0 0 1 50 100 A ${rx} 50 0 0 ${sweep} 50 0 Z` : `M 50 0 A 50 50 0 0 0 50 100 A ${rx} 50 0 0 ${sweep} 50 0 Z`);
    }

    // --- Time Utilities ---
    function getTimeZoneParts(utcMs, timeZone) {
        const parts = new Intl.DateTimeFormat('en-US', { timeZone, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(utcMs));
        return Object.fromEntries(parts.filter(({ type }) => type !== 'literal').map(({ type, value }) => [type, Number(value)]));
    }
    function getTimeZoneOffsetMs(utcMs, timeZone) {
        const p = getTimeZoneParts(utcMs, timeZone);
        return Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(utcMs / 1000) * 1000;
    }
    function localDateTimeToUtcMs(dVal, tVal, tz) {
        const [y, m, d] = dVal.split('-').map(Number), [h, min] = tVal.split(':').map(Number);
        const lMs = Date.UTC(y, m - 1, d, h, min);
        let uMs = lMs - getTimeZoneOffsetMs(lMs, tz);
        return lMs - getTimeZoneOffsetMs(uMs, tz);
    }

    function setNow() {
        const p = getTimeZoneParts(Date.now(), currentLoc.timeZone);
        document.getElementById('date').value = `${p.year}-${String(p.month).padStart(2, '0')}-${String(p.day).padStart(2, '0')}`;
        document.getElementById('time').value = `${String(p.hour).padStart(2, '0')}:${String(p.minute).padStart(2, '0')}`;
    }

    function calculateMoon(e) {
        e.preventDefault();
        const dIn = document.getElementById('date').value, tIn = document.getElementById('time').value;
        const targetMs = localDateTimeToUtcMs(dIn, tIn, currentLoc.timeZone);
        const startMs = localDateTimeToUtcMs(dIn, '00:00', currentLoc.timeZone);
        const nextD = new Date(Date.UTC(...dIn.split('-').map((v,i)=>i===1?v-1:i===2?Number(v)+1:v))).toISOString().slice(0, 10);
        const endMs = localDateTimeToUtcMs(nextD, '00:00', currentLoc.timeZone);
        const elevation = parseFloat(document.getElementById('elevation').value) || 0;

        const pos = getMoonPosition(targetMs, currentLoc.lat, currentLoc.lng);
        const times = getMoonRiseSet(startMs, endMs, currentLoc.lat, currentLoc.lng, elevation);

        document.getElementById('res-altitude').innerText = `${pos.altitude.toFixed(1)}°`;
        document.getElementById('res-azimuth').innerText = `${pos.azimuth.toFixed(1)}°`;
        document.getElementById('res-direction').innerText = i18n[currentLang].compass[Math.round(((pos.azimuth %= 360) < 0 ? pos.azimuth + 360 : pos.azimuth) / 45) % 8];

        drawMoonPhaseVisual(getMoonPhase(targetMs), currentLoc.lat);
        
        const stat = document.getElementById('res-status'), dict = i18n[currentLang];
        stat.innerText = pos.altitude > 0 ? dict.moonUp : dict.moonDown;
        stat.className = pos.altitude > 0 ? "horizon-status status-up" : "horizon-status status-down";

        const fmt = (t) => new Intl.DateTimeFormat('he-IL', { timeZone: currentLoc.timeZone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(t));
        document.getElementById('res-rise').innerText = times.rises.length ? times.rises.map(fmt).join(', ') : dict.noneToday;
        document.getElementById('res-set').innerText = times.sets.length ? times.sets.map(fmt).join(', ') : dict.noneToday;
        
        const [r1, s1] = [times.rises[0]||Infinity, times.sets[0]||Infinity];
        document.getElementById('box-rise').style.order = r1 < s1 ? 1 : 2;
        document.getElementById('box-set').style.order = s1 < r1 ? 1 : 2;
        
        document.getElementById('result').style.display = 'block';
    }

    window.onload = () => { changeLanguage(); setNow(); handleListSelection(); };
</script>
