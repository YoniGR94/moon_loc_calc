    // --- 1. הגדרות ונתונים ---

        },

            calc: "Calculate", alt: "Altitude", az: "Azimuth", rise: "Rise", set: "Set", noneToday: "None today",

                riy: "Riyadh, Saudi Arabia", dub: "Dubai, UAE",
                cyp: "Nicosia, Cyprus", ath: "Athens, Greece", rom: "Rome, Italy", vie: "Vienna, Austria",

                add: "أديس أبابا، إثيوبيا", cap: "كيب تاون، جنوب أفريقيا", ny: "نيويورك، أمريكا", la: "لوس أنجلوس، أمريكا"

    let currentLang = 'he';

    // --- 2. פונקציות ממשק ושפות ---
    function changeLanguage() {
        currentLang = document.getElementById('lang-selector').value;
        const dict = i18n[currentLang];
        
        document.getElementById('html-root').dir = dict.dirRtl;
        document.getElementById('html-root').lang = currentLang;
        
        document.getElementById('lbl-title').innerText = dict.title;
        document.getElementById('page-title').innerText = dict.title;
        document.getElementById('lbl-date').innerText = dict.date;

        document.getElementById('lbl-location').innerText = dict.location;

        document.getElementById('lbl-alt').innerText = dict.alt;
        document.getElementById('lbl-az').innerText = dict.az;
        document.getElementById('lbl-rise').innerText = dict.rise;

        document.getElementById('loc-tlv').innerText = dict.locs.tlv;

        document.getElementById('loc-eil').innerText = dict.locs.eil;

        document.getElementById('loc-dub').innerText = dict.locs.dub;
        document.getElementById('loc-cyp').innerText = dict.locs.cyp;

        document.getElementById('loc-rom').innerText = dict.locs.rom;

    // --- 3. אלגוריתמים אסטרונומיים ---
    const PI = Math.PI, rad = PI / 180, deg = 180 / PI, e = rad * 23.4397;
    function toDays(dateValue) { return dateValue / 86400000 - 10957.5; }
    function rightAscension(l, b) { return Math.atan2(Math.sin(l) * Math.cos(e) - Math.tan(b) * Math.sin(e), Math.cos(l)); }
    function declination(l, b) { return Math.asin(Math.sin(b) * Math.cos(e) + Math.cos(b) * Math.sin(e) * Math.sin(l)); }
    function azimuthCoord(H, phi, dec) { return Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi)); }
    function altitudeCoord(H, phi, dec) { return Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H)); }
    function siderealTime(d, lw) { return rad * (280.16 + 360.9856235 * d) - lw; }

    function moonCoords(d) {
        const L = rad * (218.316 + 13.176396 * d);
        const M = rad * (134.963 + 13.064993 * d);
        const F = rad * (93.272 + 13.229350 * d);
        const l  = L + rad * 6.289 * Math.sin(M);
        const b  = rad * 5.128 * Math.sin(F);
        const dt = 385001 - 20905 * Math.cos(M); 
        return { ra: rightAscension(l, b), dec: declination(l, b), dist: dt };
    }

    function getMoonPosition(dateValue, lat, lng) {
        const lw = rad * -lng, phi = rad * lat, d = toDays(dateValue);
        const c = moonCoords(d);
        const H = siderealTime(d, lw) - c.ra;
        let h = altitudeCoord(H, phi, c.dec);
        h = h + rad * 0.017 / Math.tan(h + rad * rad * 10.3 / (h + rad * 5.10));
        h = h - Math.asin(6371.0 / c.dist * Math.cos(h));
        let az = azimuthCoord(H, phi, c.dec) + PI;
        return { azimuth: (az * deg) % 360, altitude: h * deg };
    }

    function getMoonRiseSet(utcStartMs, utcEndMs, lat, lng) {
        let rises = [], sets = [];
        const h0 = -0.583;
        let prevAlt = getMoonPosition(utcStartMs, lat, lng).altitude;
        for (let t = utcStartMs + 2 * 60000; t <= utcEndMs; t += 2 * 60000) {
            const alt = getMoonPosition(t, lat, lng).altitude;
            if (prevAlt < h0 && alt >= h0) rises.push(t);
            if (prevAlt >= h0 && alt < h0) sets.push(t);
            prevAlt = alt;
        }
        return { rises, sets };
    }

    // --- חישוב וציור מצב הירח ---
    function getMoonPhase(utcMs) {
        // הערה לגבי דיוק: הפאזה מחושבת על בסיס ממוצע החודש הסינודי (29.53058867 ימים)
        // מייחוס של ה-6 לינואר 2000. היא אינה מחושבת על פי גיאומטריה שמש-ירח אמיתית 
        // ויכולה לסטות בעד כ-14 שעות לעומת הפאזה הריאלית.
        const d = toDays(utcMs);
        const newMoonEpoch = toDays(Date.UTC(2000, 0, 6, 14, 24, 0));
        const lunation = 29.53058867;
        let phase = ((d - newMoonEpoch) % lunation) / lunation;
        if (phase < 0) phase += 1;
        return phase; 
    }

    function drawMoonPhaseVisual(phase, lat) {
        const pDict = i18n[currentLang].phases;
        let phaseText = "";

        if (phase < 0.03 || phase > 0.97) phaseText = pDict.new;
        else if (phase < 0.22) phaseText = pDict.waxCres;
        else if (phase < 0.28) phaseText = pDict.firstQuar;
        else if (phase < 0.47) phaseText = pDict.waxGib;
        else if (phase < 0.53) phaseText = pDict.full;
        else if (phase < 0.72) phaseText = pDict.wanGib;
        else if (phase < 0.78) phaseText = pDict.lastQuar;
        else phaseText = pDict.wanCres;

        document.getElementById('res-phase-text').innerText = phaseText;

        const path = document.getElementById('moon-lit-path');
        const svg = document.getElementById('moon-svg');
        
        // התאמה לחצי הכדור הדרומי - הירח מתמלא משמאל לימין בדרום
        if (lat < 0) {
            svg.style.transform = 'scaleX(-1)';
        } else {
            svg.style.transform = 'scaleX(1)';
        }

        let d = ""; 
        
        if (phase <= 0.5) {
            const sweep = phase <= 0.25 ? 0 : 1; 
            const rx = Math.abs(50 - (phase * 200));
            d = `M 50 0 A 50 50 0 0 1 50 100 A ${rx} 50 0 0 ${sweep} 50 0 Z`;
        } else {
            const p = phase - 0.5;
            const sweep = p <= 0.25 ? 1 : 0;
            const rx = Math.abs(50 - (p * 200));
            d = `M 50 0 A 50 50 0 0 0 50 100 A ${rx} 50 0 0 ${sweep} 50 0 Z`;
        }
        
        path.setAttribute('d', d);
    }

    function getCompassDirection(azimuth) {
        const directions = i18n[currentLang].compass;
        const index = Math.round(((azimuth %= 360) < 0 ? azimuth + 360 : azimuth) / 45) % 8;
        return directions[index];
    }

    // --- 4. אזורי זמן וזמנים מקומיים ---
    function getTimeZoneParts(utcMs, timeZone) {
        const parts = new Intl.DateTimeFormat('en-US', {
            timeZone, year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
        }).formatToParts(new Date(utcMs));
        return Object.fromEntries(parts.filter(({ type }) => type !== 'literal').map(({ type, value }) => [type, Number(value)]));
    }

    function getTimeZoneOffsetMs(utcMs, timeZone) {
        const parts = getTimeZoneParts(utcMs, timeZone);
        const asUtc = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
        return asUtc - Math.floor(utcMs / 1000) * 1000;
    }

    function localDateTimeToUtcMs(dateValue, timeValue, timeZone) {
        const [year, month, day] = dateValue.split('-').map(Number);
        const [hours, minutes] = timeValue.split(':').map(Number);
        const localMs = Date.UTC(year, month - 1, day, hours, minutes);
        let utcMs = localMs - getTimeZoneOffsetMs(localMs, timeZone);
        utcMs = localMs - getTimeZoneOffsetMs(utcMs, timeZone);
        return utcMs;
    }

    function formatLocalTime(utcMs, timeZone) {
        if (utcMs === null) return "--:--";
        return new Intl.DateTimeFormat('he-IL', {
            timeZone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).format(new Date(utcMs));
    }

    function updateTzInfo() {
        const locKey = document.getElementById('location').value;
        const loc = locations[locKey];
        const offsetMs = getTimeZoneOffsetMs(Date.now(), loc.timeZone);
        const offsetHours = offsetMs / 3600000;
        const sign = offsetHours >= 0 ? '+' : '';
        document.getElementById('tz-info').innerText = `${loc.timeZone} · UTC${sign}${offsetHours}`;
    }

    function setNow() {
        const locKey = document.getElementById('location').value;
        const loc = locations[locKey];
        const parts = getTimeZoneParts(Date.now(), loc.timeZone);
        document.getElementById('date').value = `${parts.year}-${String(parts.month).padStart(2, '0')}-${String(parts.day).padStart(2, '0')}`;
        document.getElementById('time').value = `${String(parts.hour).padStart(2, '0')}:${String(parts.minute).padStart(2, '0')}`;
    }

    // --- 5. הפונקציה הראשית לחישוב ---
    function calculateMoon(event) {
        event.preventDefault();
        const dateInput = document.getElementById('date').value;
        const timeInput = document.getElementById('time').value;
        const locKey = document.getElementById('location').value;
        const loc = locations[locKey];

        const targetUtcMs = localDateTimeToUtcMs(dateInput, timeInput, loc.timeZone);
        const utcStartMs = localDateTimeToUtcMs(dateInput, '00:00', loc.timeZone);
        const [y, m, d] = dateInput.split('-').map(Number);
        const nextDate = new Date(Date.UTC(y, m - 1, d + 1)).toISOString().slice(0, 10);
        const utcEndMs = localDateTimeToUtcMs(nextDate, '00:00', loc.timeZone);

        const pos = getMoonPosition(targetUtcMs, loc.lat, loc.lng);
        const times = getMoonRiseSet(utcStartMs, utcEndMs, loc.lat, loc.lng);

        document.getElementById('res-altitude').innerText = `${pos.altitude.toFixed(1)}°`;
        document.getElementById('res-azimuth').innerText = `${pos.azimuth.toFixed(1)}°`;
        document.getElementById('res-direction').innerText = getCompassDirection(pos.azimuth);

        // חישוב וציור מצב הירח עם התחשבות בקו הרוחב להפיכת האוריינטציה בדרום
        const currentPhase = getMoonPhase(targetUtcMs);
        drawMoonPhaseVisual(currentPhase, loc.lat);

        const statusElem = document.getElementById('res-status');
        const dict = i18n[currentLang];
        if (pos.altitude > 0) {
            statusElem.innerText = dict.moonUp;
            statusElem.className = "horizon-status status-up";
        } else {
            statusElem.innerText = dict.moonDown;
            statusElem.className = "horizon-status status-down";
        }

        let riseText = times.rises.length > 0 ? 
                       times.rises.map(t => formatLocalTime(t, loc.timeZone)).join(', ') : 
                       dict.noneToday;
                       
        let setText = times.sets.length > 0 ? 
                      times.sets.map(t => formatLocalTime(t, loc.timeZone)).join(', ') : 
                      dict.noneToday;

        document.getElementById('res-rise').innerText = riseText;
        document.getElementById('res-set').innerText = setText;
        
        let firstRise = times.rises.length > 0 ? times.rises[0] : Infinity;
        let firstSet = times.sets.length > 0 ? times.sets[0] : Infinity;
        
        if (firstSet < firstRise) {
            document.getElementById('box-set').style.order = 1;
            document.getElementById('box-rise').style.order = 2;
        } else {
            document.getElementById('box-rise').style.order = 1;
            document.getElementById('box-set').style.order = 2;
        }
        
        document.getElementById('result').style.display = 'block';
    }

    window.onload = () => {
        updateTzInfo();
        setNow();
    };
</script>
